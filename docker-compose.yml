version: '3.8'

services:
  data-mcp-server:
    build: .
    command: python src/mcp_data_server.py
    environment:
      CSV_PATH: /app/dataset/nineteenFeaturesDf.csv
      MCP_TCP_PORT: 5001
    ports:
      - "5001:5001"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((\"localhost\", 5001)); s.close()'"]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - .env

  neo4j-mcp-server:
    build: .
    command: python src/neo4j_mcp_server.py
    environment:
      MCP_TCP_PORT: 5002
      NEO4J_READ_ONLY: "false" # Allow the Architect to update the schema
    ports:
      - "5002:5002"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((\"localhost\", 5002)); s.close()'"]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - .env
  
  streamlit-app:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.enableCORS false --server.enableXsrfProtection false
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      # These environment variables are crucial for the agents to connect to the MCP servers
      # The values here must match the service names and ports defined above
      DATA_MCP_HOST: data-mcp-server
      DATA_MCP_PORT: 5001
      NEO4J_MCP_HOST: neo4j-mcp-server
      NEO4J_MCP_PORT: 5002
    depends_on:
      data-mcp-server:
        condition: service_healthy
      neo4j-mcp-server:
        condition: service_healthy
    env_file:
      - .env

  eval-runner:
    build: .
    command: python run_all_hunts.py
    volumes:
      - .:/app
    environment:
      # These environment variables are crucial for the agents to connect to the MCP servers
      # The values here must match the service names and ports defined above
      DATA_MCP_HOST: data-mcp-server
      DATA_MCP_PORT: 5001
      NEO4J_MCP_HOST: neo4j-mcp-server
      NEO4J_MCP_PORT: 5002
    depends_on:
      data-mcp-server:
        condition: service_healthy
      neo4j-mcp-server:
        condition: service_healthy
    env_file:
      - .env