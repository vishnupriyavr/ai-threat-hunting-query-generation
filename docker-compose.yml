version: '3.8'
services:
  app:
    build: .
    container_name: ai-threat-app
    volumes:
      - ./:/app
    env_file: .env
    environment:
      - OPENAI_API_KEY
      - NEO4J_URI
      - NEO4J_USER
      - NEO4J_PASSWORD
    command: tail -f /dev/null

  jupyter:
    build: .
    container_name: ai-threat-jupyter
    volumes:
      - ./:/app
    ports:
      - "8888:8888"
    env_file: .env
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token=''

  eval:
    build: .
    container_name: ai-threat-eval
    volumes:
      - ./:/app
    env_file: .env
    depends_on:
      - app
    entrypoint: ["bash", "-lc"]
    command: "python evaluation.py --outcomes assignment/hypotheses_outcomes.json --hypotheses assignment/hypotheses.json --out EVALUATION_REPORT_generated.md --eval_out evaluation_results.json"

  data-mcp:
    build: .
    container_name: ai-threat-data-mcp
    volumes:
      - ./:/app
    env_file: .env
    environment:
      - CSV_PATH
    depends_on:
      - app
    command: ["python", "src/mcp_data_server.py"]
    restart: unless-stopped
    ports:
      - "5001:5001"

  neo4j-mcp:
    build: .
    container_name: ai-threat-neo4j-mcp
    volumes:
      - ./:/app
    env_file: .env
    environment:
      - MCP_TCP_PORT=5002
    depends_on:
      - app
    command: ["python", "src/neo4j_mcp_server.py"]
    restart: unless-stopped
    ports:
      - "5002:5002"

  neo4j:
    image: neo4j:5.11.0
    container_name: ai-threat-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_dbms_default__listen__address=0.0.0.0
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/import:/var/lib/neo4j/import
      - ./scripts/neo4j:/init
    restart: unless-stopped

  neo4j-init:
    image: neo4j:5.11.0
    container_name: ai-threat-neo4j-init
    depends_on:
      - neo4j
    env_file: .env
    volumes:
      - ./scripts/neo4j:/init
    entrypoint: ["bash","-c","until cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' >/dev/null 2>&1; do echo 'waiting for neo4j...'; sleep 1; done; echo 'running init cql'; cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} < /init/init_ontology.cql; echo 'neo4j init finished'"]
    restart: 'no'
